<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form fixture</title>
<link rel="stylesheet" href="/form-base.css">
</head><body><main><h1>Book a pump check</h1>
<form id="elsewhere" data-elsewhere="/lead-elsewhere-200" method="post">
<label for="f-name">Your name</label><input id="f-name" name="name" type="text" required autocomplete="name"><label for="f-email">Work email</label><input id="f-email" name="email" type="email" required autocomplete="email" inputmode="email">
<button type="submit">Send request</button>
<p role="status" aria-live="polite"></p>
</form>
</main><script>
document.querySelector("form").addEventListener("submit", function (event) {
  event.preventDefault();
  var form = event.target;
  fetch(form.getAttribute("data-elsewhere"), { method: "POST", body: new FormData(form) }).then(function () { form.querySelector("[role=status]").textContent = "Thanks, we reply within one working day."; });
});
</script></body></html>
