<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form fixture</title>
<link rel="stylesheet" href="/form-base.css">
</head><body><main><h1>Book a pump check</h1>
<form id="aborts" action="/lead-hold" method="post">
<label for="f-name">Your name</label><input id="f-name" name="name" type="text" required autocomplete="name"><label for="f-email">Work email</label><input id="f-email" name="email" type="email" required autocomplete="email" inputmode="email">
<button type="submit">Send request</button>
</form>
</main><script>
// Posts the form by script to a host that holds the answer, and cancels its own request after 300 ms.
var form = document.querySelector("form");
form.addEventListener("submit", function (event) {
  event.preventDefault();
  var controller = new AbortController();
  fetch(form.getAttribute("action"), { method: "POST", body: new FormData(form), signal: controller.signal }).catch(function () {});
  setTimeout(function () { controller.abort(); }, 300);
});
</script></body></html>
