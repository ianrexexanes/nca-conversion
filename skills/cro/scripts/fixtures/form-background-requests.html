<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form fixture</title>
<link rel="stylesheet" href="/form-base.css">
</head><body><main><h1>Book a pump check</h1>
<form id="background" action="/api/lead" method="post">
<label for="f-name">Your name</label><input id="f-name" name="name" type="text" required autocomplete="name"><label for="f-email">Work email</label><input id="f-email" name="email" type="email" required autocomplete="email" inputmode="email">
<button type="submit">Send request</button>
</form>
</main><script>
// A page that requests a file by script every 20 ms from load on, as a chat widget that polls does. At the submit event the form shows "Sending..."
// and posts by script 700 ms later.
var count = 0;
setInterval(function () { fetch("/form-base.css?n=" + (count++)); }, 20);
var form = document.querySelector("form");
form.addEventListener("submit", function (event) {
  event.preventDefault();
  form.querySelector("button").textContent = "Sending...";
  setTimeout(function () {
    fetch(form.getAttribute("action"), { method: "POST", body: new FormData(form) });
  }, 700);
});
</script></body></html>
