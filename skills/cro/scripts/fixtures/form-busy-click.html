<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form fixture</title>
<link rel="stylesheet" href="/form-base.css">
</head><body><main><h1>Book a pump check</h1>
<form id="busy" data-js action="/lead" method="post">
<label for="f-name">Your name</label><input id="f-name" name="name" type="text" required autocomplete="name"><label for="f-email">Work email</label><input id="f-email" name="email" type="email" required autocomplete="email" inputmode="email">
<button type="submit">Send request</button>
<p role="status" aria-live="polite"></p>
</form>
</main><script>
// A click handler that keeps the page busy for 5.5 seconds, so the click call times out after the click has landed.
document.querySelector("button").addEventListener("click", function () {
  var t = Date.now();
  while (Date.now() - t < 5500) {}
});
</script><script src="/form-send.js"></script></body></html>
