<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form fixture</title>
<link rel="stylesheet" href="/form-base.css">
</head><body><main><h1>Book a pump check</h1>
<form id="lead" action="/lead" method="post">
<label for="f-name">Your name</label><input id="f-name" name="name" type="text" required autocomplete="name"><label for="f-email">Work email</label><input id="f-email" name="email" type="email" required autocomplete="email" inputmode="email">
<button id="go" type="submit">Send request</button>
</form>
<div role="status"><span hidden>Something went wrong. Please email us instead.</span><span hidden>Thanks, we reply soon.</span></div>
</main><script>
document.getElementById('lead').addEventListener('submit', function (event) {
  event.preventDefault();
  fetch('/lead', { method: 'POST', body: new FormData(event.target) }).then(function () {
    document.getElementById('go').textContent = 'Request sent';
  });
});
</script></body></html>
